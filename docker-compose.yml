services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pdf-metadata-sqli-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pdf-metadata-sqli-app
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      # Set to "false" for the fixed version (parameterized queries)
      VULNERABLE: "true"
      DB_HOST: "db"
      DB_PORT: "1433"
      DB_USER: "sa"
      DB_PASS: "Str0ng!Passw0rd"
      DB_NAME: "docindex"
    restart: unless-stopped
